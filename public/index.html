<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTag Mod Admin Dashboard</title><style>body{font-family:system-ui,sans-serif;background:#0f1115;color:#eee;display:flex;justify-content:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box}.card{background:#1a1d24;padding:28px;border-radius:14px;width:min(540px,100%);box-shadow:0 8px 24px #0008}h1{font-size:22px;margin:0 0 8px}h2{font-size:16px;margin:24px 0 8px}.sub,.note{font-size:12px;color:#999;line-height:1.45}label{display:block;margin:12px 0 6px;font-size:13px;color:#aaa}input{width:100%;box-sizing:border-box;padding:10px;border-radius:7px;border:1px solid #333;background:#0f1115;color:#eee}button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:7px;background:#4f8cff;color:white;font-weight:600;cursor:pointer}.secondary{background:#343943}.section{border-top:1px solid #2a2d34;margin-top:22px;padding-top:4px}.list{margin-top:10px;border:1px solid #2a2d34;border-radius:8px;overflow:hidden}.row{padding:10px 12px;border-bottom:1px solid #2a2d34;font-size:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.row:last-child{border-bottom:0}.id{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.remove{width:auto;margin:0;padding:0;background:none;color:#ff7777}.badge{color:#9fc0ff}.status{margin-top:10px;font-size:13px;white-space:pre-wrap}</style></head><body><div class="card"><h1>GTag Mod Admin Dashboard</h1><div class="sub">Use Photon UserIds. An admin can be authorized here OR in the client code list.</div><label>Upload key</label><input type="password" id="key" placeholder="Render UPLOAD_KEY"><div class="section"><h2>Publish mod build</h2><form id="uploadForm"><label>Version</label><input type="text" id="version" placeholder="e.g. 1.0.3" required><label>DLL file</label><input type="file" id="modfile" accept=".dll" required><button>Upload & Publish</button></form><div id="status" class="status"></div><div id="current" class="note">Loading...</div></div><div class="section"><h2>Admin access</h2><label>Photon UserId</label><input type="text" id="adminId" placeholder="Paste Photon UserId"><button id="addAdmin">Add dashboard admin</button><div id="mode" class="note"></div><div id="admins" class="list"></div></div><div class="section"><h2>Banned players</h2><div class="note">Persistent bans are stored in your GitHub-backed storage.</div><div id="bans" class="list"></div></div><button id="refresh" class="secondary">Refresh</button></div><script>const $=id=>document.getElementById(id),key=()=>$('key').value.trim();async function api(u,o={}){const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}function row(el,id,label,fn){const r=document.createElement('div');r.className='row';const s=document.createElement('span');s.className='id';s.textContent=id;r.appendChild(s);const b=document.createElement('button');b.className='remove';b.textContent=label;b.onclick=fn;r.appendChild(b);el.appendChild(r)}async function refreshVersion(){try{const d=await api('/version');$('current').textContent='Current live version: '+(d.version||'none yet')}catch(e){$('current').textContent=e.message}}async function refreshAdmins(){const d=await api('/admins');$('mode').innerHTML='Code-admin mode: <span class="badge">'+(d.allowCodeAdmins?'ON':'OFF')+'</span> — Admin.cs IDs work without dashboard entry when ON.';const el=$('admins');el.innerHTML='';if(!d.admins.length){el.textContent='No dashboard admins added.';return}d.admins.forEach(id=>row(el,id,'remove',async()=>{if(!key())return alert('Enter the upload key.');await api('/admins/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key(),userId:id})});refreshAdmins()}))}async function refreshBans(){const el=$('bans');el.innerHTML='';try{const d=await api('/bans?key='+encodeURIComponent(key()));if(!d.bans.length){el.textContent='No players are banned.';return}d.bans.forEach(id=>row(el,id,'unban',async()=>{await api('/bans/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key(),userId:id})});refreshBans()}))}catch(e){el.textContent='Enter the upload key to view bans.'}}function refresh(){refreshVersion();refreshAdmins();refreshBans()}$('uploadForm').onsubmit=async e=>{e.preventDefault();$('status').textContent='Uploading...';try{const f=new FormData();f.append('key',key());f.append('version',$('version').value.trim());f.append('modfile',$('modfile').files[0]);const d=await api('/upload',{method:'POST',body:f});$('status').textContent='Published v'+d.version;refreshVersion()}catch(e){$('status').textContent='Error: '+e.message}};$('addAdmin').onclick=async()=>{const id=$('adminId').value.trim();if(!key()||!id)return alert('Enter the upload key and Photon UserId.');try{await api('/admins/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key(),userId:id})});$('adminId').value='';refreshAdmins()}catch(e){alert(e.message)}};$('refresh').onclick=refresh;refresh();</script></body></html>
